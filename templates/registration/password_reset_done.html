{% extends "base.html" %}
{% block title %}Check your email — Cadence{% endblock %}
{% block auth_content %}
  <div class="auth-card reveal">
    <div class="brand"><span class="wordmark" style="font-size:34px;">cadence<span class="dot">.</span></span></div>
    <h1>Check your email</h1>
    <p class="sub">If an account exists for that address, we’ve sent a password reset link.</p>
    <p class="helptext" style="text-align:center;margin-top:18px;"><a href="{% url 'login' %}">Back to sign in</a></p>
  </div>
{% endblock %}
