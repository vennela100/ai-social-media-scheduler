{% extends "base.html" %}
{% block title %}Reset your password — Cadence{% endblock %}
{% block auth_content %}
  <div class="auth-card reveal">
    <div class="brand"><span class="wordmark" style="font-size:34px;">cadence<span class="dot">.</span></span></div>
    <h1>Reset your password</h1>
    <p class="sub">Enter the email you used to create your account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px;">Send reset link</button>
    </form>
    <p class="helptext" style="text-align:center;margin-top:18px;"><a href="{% url 'login' %}">Back to sign in</a></p>
  </div>
{% endblock %}
